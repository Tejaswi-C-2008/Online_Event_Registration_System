<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-calendar2-event-fill"></i></div>
                <span>EventHub</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="register.html" class="btn btn-outline-custom btn-sm">Create Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Auth Form -->
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
                    <i class="bi bi-box-arrow-in-right"></i>
                </div>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted small">Sign in to manage your tickets and events</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Username or Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" name="identifier" class="form-control" placeholder="admin or attendee email" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                        <button type="button" class="btn btn-light border" onclick="togglePasswordVisibility('loginPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-3 small">
                <span class="text-muted">Don't have an account?</span>
                <a href="register.html" class="fw-semibold ms-1">Register now</a>
            </div>

            <!-- Demo Credentials Helper -->
            <div class="demo-credentials-box">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <strong class="text-dark small"><i class="bi bi-info-circle me-1"></i> Quick Test Logins:</strong>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary flex-fill" onclick="fillCredentials('admin', 'admin123')">
                        <i class="bi bi-shield-lock me-1"></i> Admin Demo
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary flex-fill" onclick="fillCredentials('john@example.com', 'user123')">
                        <i class="bi bi-person me-1"></i> User Demo
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function fillCredentials(id, pwd) {
            const form = document.getElementById('login-form');
            form.identifier.value = id;
            form.password.value = pwd;
            showToast(`Filled credentials for ${id}`, 'info');
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i class="bi bi-eye"></i>';
            }
        }
    </script>
</body>
</html>
