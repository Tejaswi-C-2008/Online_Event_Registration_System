<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Ticket Pass — EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-calendar2-event-fill"></i></div>
                <span>EventHub</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Browse Events</a></li>
                    <li class="nav-item"><a class="nav-link active" href="verify-ticket.html">Verify Pass</a></li>
                </ul>
                <div id="navbar-auth-section"></div>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper" style="min-height: calc(100vh - 200px);">
        <div class="auth-card" style="max-width: 550px;">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-2" style="width: 54px; height: 54px; font-size: 1.6rem;">
                    <i class="bi bi-qr-code-scan"></i>
                </div>
                <h3 class="fw-bold">Ticket Pass Verifier</h3>
                <p class="text-muted small">Enter the alphanumeric ticket code printed on the digital pass to authenticate validity.</p>
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-upc-scan"></i></span>
                <input type="text" id="verifyTicketCodeInput" class="form-control" placeholder="e.g. TKT-2026-AI7821" style="font-family: monospace; letter-spacing: 0.1em;">
                <button class="btn btn-primary-custom" onclick="verifyTicketCode()">
                    <i class="bi bi-search me-1"></i> Verify
                </button>
            </div>

            <!-- Result Container -->
            <div id="verify-result-container"></div>
        </div>
    </main>

    <footer>
        <div class="container text-center text-muted small">
            <p>&copy; 2026 EventHub — Online Event Registration System.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function verifyTicketCode() {
            const code = document.getElementById('verifyTicketCodeInput').value.trim();
            const container = document.getElementById('verify-result-container');

            if (!code) {
                showToast('Please enter a ticket code.', 'warning');
                return;
            }

            container.innerHTML = `
                <div class="text-center py-3">
                    <div class="spinner-border spinner-border-sm text-primary me-2"></div> Checking ticket...
                </div>
            `;

            try {
                const res = await fetch(`api/ticket/verify?code=${encodeURIComponent(code)}`);
                const data = await res.json();

                if (data.success && data.data) {
                    const ticket = data.data;
                    const isValid = ticket.status === 'CONFIRMED';

                    container.innerHTML = `
                        <div class="alert ${isValid ? 'alert-success' : 'alert-danger'} py-3 rounded-3">
                            <div class="d-flex align-items-center gap-3 mb-3">
                                <i class="bi ${isValid ? 'bi-patch-check-fill text-success' : 'bi-x-octagon-fill text-danger'} fs-2"></i>
                                <div>
                                    <h5 class="fw-bold mb-0">${isValid ? 'Valid & Confirmed Pass' : 'Cancelled / Void Pass'}</h5>
                                    <small class="text-muted">Ticket Code: <span class="font-monospace fw-bold">${ticket.ticketCode}</span></small>
                                </div>
                            </div>
                            <hr>
                            <div class="row g-2 small">
                                <div class="col-sm-6">
                                    <span class="text-muted">Attendee Name:</span><br>
                                    <strong>${ticket.userName}</strong>
                                </div>
                                <div class="col-sm-6">
                                    <span class="text-muted">Email:</span><br>
                                    <strong>${ticket.userEmail}</strong>
                                </div>
                                <div class="col-sm-6 mt-2">
                                    <span class="text-muted">Event:</span><br>
                                    <strong>${ticket.eventTitle}</strong>
                                </div>
                                <div class="col-sm-6 mt-2">
                                    <span class="text-muted">Tickets Held:</span><br>
                                    <strong>${ticket.ticketsCount} ticket(s) — ${formatCurrency(ticket.totalPrice)}</strong>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="alert alert-warning py-3 rounded-3 d-flex align-items-center gap-3">
                            <i class="bi bi-exclamation-triangle-fill fs-3 text-warning"></i>
                            <div>
                                <h6 class="fw-bold mb-0">Ticket Not Found</h6>
                                <small class="text-muted">No valid booking record matches the code "${escapeHTML(code)}".</small>
                            </div>
                        </div>
                    `;
                }
            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger">Error verifying ticket. Please try again.</div>`;
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        document.getElementById('verifyTicketCodeInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') verifyTicketCode();
        });
    </script>
</body>
</html>
