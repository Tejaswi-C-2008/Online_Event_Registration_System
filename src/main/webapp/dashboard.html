<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets &amp; Bookings — EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-calendar2-event-fill"></i></div>
                <span>EventHub</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Browse Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="verify-ticket.html">Verify Pass</a></li>
                </ul>
                <div id="navbar-auth-section"></div>
            </div>
        </div>
    </nav>

    <!-- Header Banner -->
    <header class="bg-dark text-white py-4" style="background: linear-gradient(135deg, #1e1b4b, #312e81) !important;">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-wallet2 me-2"></i>My Ticket Wallet</h2>
                    <p class="text-slate-300 mb-0">View your active passes, download PDF/print passes, or manage registrations.</p>
                </div>
                <a href="events.html" class="btn btn-primary-custom btn-sm">
                    <i class="bi bi-plus-circle me-1"></i> Book More Events
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-5 bg-light">
        <div class="container">
            <div class="row" id="user-registrations-container">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="text-muted mt-2">Loading your registered tickets...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center text-muted small">
            <p>&copy; 2026 EventHub — Online Event Registration System.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initAuth();
            if (!AppState.currentUser) {
                showToast('Please sign in to access your dashboard.', 'warning');
                setTimeout(() => { window.location.href = 'login.html'; }, 1000);
                return;
            }
            loadUserRegistrations();
        });
    </script>
</body>
</html>
