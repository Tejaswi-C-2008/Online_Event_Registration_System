<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand brand-logo" href="index.html">
                <div class="brand-icon"><i class="bi bi-calendar2-event-fill"></i></div>
                <span>EventHub</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="login.html" class="btn btn-outline-custom btn-sm">Already have an account?</a>
            </div>
        </div>
    </nav>

    <!-- Main Auth Form -->
    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.3rem;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h3 class="fw-bold">Create an Account</h3>
                <p class="text-muted small">Join thousands of attendees and register for events</p>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Full Name</label>
                        <input type="text" name="fullName" class="form-control" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold small">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="e.g. johndoe" required>
                    </div>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-7">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-semibold small">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="+1-555-0199">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" name="password" id="regPassword" class="form-control" placeholder="At least 6 characters" minlength="6" required oninput="checkPasswordStrength(this.value)">
                    <div class="progress mt-2" style="height: 4px;">
                        <div id="password-strength-bar" class="progress-bar bg-danger" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-3 small">
                <span class="text-muted">Already registered?</span>
                <a href="login.html" class="fw-semibold ms-1">Sign In</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function checkPasswordStrength(val) {
            const bar = document.getElementById('password-strength-bar');
            let strength = 0;
            if (val.length >= 6) strength += 30;
            if (/[A-Z]/.test(val)) strength += 30;
            if (/[0-9]/.test(val)) strength += 20;
            if (/[^A-Za-z0-9]/.test(val)) strength += 20;

            bar.style.width = strength + '%';
            if (strength <= 30) {
                bar.className = 'progress-bar bg-danger';
            } else if (strength <= 70) {
                bar.className = 'progress-bar bg-warning';
            } else {
                bar.className = 'progress-bar bg-success';
            }
        }
    </script>
</body>
</html>
